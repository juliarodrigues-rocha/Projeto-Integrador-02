<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="VisualizarPontuacao.css">
  <title>Sistema do Aluno</title>
</head>

<body>
  <header>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/31/Logo_PUC-Campinas.svg/750px-Logo_PUC-Campinas.svg.png" alt="Logo da Puc">
    <hr>
  </header>

  <main class="container">
    <h1>Visualizar Pontuação</h1>

    <form>
      <div class="input-ra">
        <label for="ra">RA:</label>
        <div class="ra-group">
          <input type="text" id="ra" name="ra" placeholder="Digite seu RA">
          <button id="buscar" type="button">IR</button>
        </div>
      </div>

      <div class="input-block">
        <label for="Livroslidos">Quantidade de livros lidos nos últimos 6 meses:</label>
        <input type="text" id="Livroslidos" name="Livroslidos">
      </div>

      <div class="input-block">
        <label for="classif">Classificação:</label>
        <input type="text" id="classif" name="classif">
      </div>

      <div class="classificacao-info">
        <h4>Classificações de Leitura</h4>
        <ul>
          <li><strong>Leitor Iniciante:</strong> Até 5 livros lidos</li>
          <li><strong>Leitor Regular:</strong> 6 a 10 livros</li>
          <li><strong>Leitor Ativo:</strong> 11 a 20 livros</li>
          <li><strong>Leitor Extremo:</strong> mais de 20 livros</li>
        </ul>
      </div>

      <h3>Livros lidos</h3>
    </form>

    <table>
      <thead>
        <tr>
          <th>Código</th>
          <th>Título</th>
          <th>Data</th>
          <th>Hora</th>
        </tr>
      </thead>
      <tbody>
        <tr><td></td><td></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td><td></td></tr>
      </tbody>
    </table>

    <a class="vermelho" href="index.html">Voltar</a>
  </main>

  <footer>
    © 2025 PUC-Campinas. Todos os direitos reservados.
  </footer>
</body>
</html>
